<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B2C"/>
      <stop offset="100%" stop-color="#16283F"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A24B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle ledger grid lines -->
  <g stroke="#1F3A5F" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
