    <rect x="20" y="50" width="130" height="4" fill="#4C7A63"/>
    <rect x="20" y="66" width="150" height="4" fill="#1F3A5F"/>
    <rect x="20" y="82" width="110" height="4" fill="#1F3A5F"/>
    <rect x="20" y="98" width="160" height="4" fill="#1F3A5F"/>
    <rect x="20" y="120" width="180" height="2" fill="#0E1B2C" opacity="0.4"/>
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="14" fill="#0E1B2C" font-weight="bold">TOTAL   R 1,248.50</text>
    <text x="20" y="168" font-family="'Courier New', monospace" font-size="11" fill="#4C7A63">REF #TXN-2A9F41C0</text>
    <text x="20" y="184" font-family="'Courier New', monospace" font-size="11" fill="#4C7A63">STATUS  APPROVED</text>
