  <text x="64" y="168" font-family="'Courier New', monospace" font-size="18" letter-spacing="3" fill="#C9A24B">ASP.NET CORE &#8226; TELLER &amp; POINT-OF-SALE API</text>
  <text x="64" y="200" font-family="Arial, sans-serif" font-size="16" fill="#8FA3BF">Accounts &#183; Transactions &#183; Tills &#183; Shift Sessions &#183; Receipts</text>

  <line x1="60" y1="222" x2="500" y2="222" stroke="url(#goldLine)" stroke-width="2"/>

