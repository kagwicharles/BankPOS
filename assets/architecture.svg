<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C9A24B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" fill="#0E1B2C"/>
  <text x="500" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F5F3EE">Request Flow</text>

  <!-- Client -->
  <rect x="40" y="75" width="200" height="70" rx="6" fill="#16283F" stroke="#1F3A5F"/>
  <text x="140" y="105" text-anchor="middle" font-family="Arial" font-size="15" fill="#F5F3EE">POS Terminal / Client</text>
  <text x="140" y="124" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">HTTP JSON</text>

  <!-- Controllers -->
  <rect x="300" y="75" width="220" height="70" rx="6" fill="#16283F" stroke="#C9A24B"/>
  <text x="410" y="100" text-anchor="middle" font-family="Arial" font-size="15" fill="#F5F3EE">Controllers</text>
  <text x="410" y="120" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">TransactionController</text>
  <text x="410" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">AccountController</text>

  <!-- DTOs -->
  <rect x="580" y="75" width="200" height="70" rx="6" fill="#16283F" stroke="#1F3A5F"/>
  <text x="680" y="100" text-anchor="middle" font-family="Arial" font-size="15" fill="#F5F3EE">DTOs</text>
  <text x="680" y="120" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">Request / Response</text>
  <text x="680" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">records</text>

  <!-- Services -->
  <rect x="300" y="200" width="220" height="70" rx="6" fill="#16283F" stroke="#4C7A63"/>
  <text x="410" y="225" text-anchor="middle" font-family="Arial" font-size="15" fill="#F5F3EE">Services</text>
  <text x="410" y="245" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">ITransactionService</text>
  <text x="410" y="260" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">IAccountService</text>

  <!-- Entities -->
  <rect x="300" y="325" width="220" height="70" rx="6" fill="#16283F" stroke="#1F3A5F"/>
  <text x="410" y="350" text-anchor="middle" font-family="Arial" font-size="15" fill="#F5F3EE">Entities / EF Core</text>
  <text x="410" y="370" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">Account, Transaction,</text>
  <text x="410" y="385" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8FA3BF">Customer, Till, Branch, Receipt</text>

  <!-- arrows -->
  <line x1="240" y1="110" x2="296" y2="110" stroke="#C9A24B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="110" x2="576" y2="110" stroke="#C9A24B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="145" x2="410" y2="196" stroke="#C9A24B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="270" x2="410" y2="321" stroke="#C9A24B" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
